openapi: 3.0.0
info:
  title: Order Service
  version: 1.1.0
paths:
  /api/v1/orders:
    get:
      summary: List orders
      operationId: list_orders
      parameters:
      - name: page
        in: query
        required: false
        schema:
          type: integer
          default: 1
      responses:
        '200':
          description: Orders
    post:
      summary: Create order
      operationId: create_order
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOrder'
      responses:
        '201':
          description: Created
        '422':
          description: Invalid
  /api/v1/orders/{id}:
    get:
      summary: Get order
      operationId: get_order
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Found
        '404':
          description: Not found
    patch:
      summary: Update status
      operationId: update_order_status
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      - name: status
        in: query
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Updated
        '404':
          description: Not found
components:
  schemas:
    Order:
      type: object
      required:
      - id
      - user_id
      - items
      - total
      - status
      properties:
        id:
          type: string
        user_id:
          type: string
        items:
          type: array
          items:
            type: string
        total:
          type: number
        status:
          type: string
        notes:
          type: string
          nullable: true
          description: Optional order notes
    CreateOrder:
      type: object
      required:
      - user_id
      - items
      - total
      properties:
        user_id:
          type: string
        items:
          type: array
          items:
            type: string
        total:
          type: number
        notes:
          type: string
